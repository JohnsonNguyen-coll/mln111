<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artistic Calendar</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-card" id="calendar">
            <div class="decorative-elements">
                <div class="statue"></div>
                <div class="butterfly"></div>
                <div class="geometric-shapes">
                    <div class="shape shape-1"></div>
                    <div class="shape shape-2"></div>
                    <div class="shape shape-3"></div>
                </div>
            </div>
            
            <div class="calendar-content">
                <h1 class="month-title" id="monthTitle">January</h1>
                
                <div class="calendar-grid">
                    <div class="weekdays">
                        <div class="weekday">SUN</div>
                        <div class="weekday">MON</div>
                        <div class="weekday">TUE</div>
                        <div class="weekday">WED</div>
                        <div class="weekday">THU</div>
                        <div class="weekday">FRI</div>
                        <div class="weekday">SAT</div>
                    </div>
                    
                    <div class="days-grid" id="daysGrid">
                        <!-- Days will be generated by JavaScript -->
                    </div>
                </div>
                
                <div class="quote" id="quote">
                    Không phải ý thức của con người quyết định tồn tại của họ; trái lại, tồn tại xã hội của họ quyết định ý thức của họ.
                </div>
            </div>
            

        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
